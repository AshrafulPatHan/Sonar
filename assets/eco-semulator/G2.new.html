<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Shape-Only Sound Echo Simulator</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --accent-color: #10b981;
      --border-color: #2a3754;
      --text-color: #f1f5f9;
      --text-dim: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--accent-color);
    }

    .subtitle {
      margin-top: 4px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: bold;
    }

    select, button, input {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus {
      border-color: var(--accent-color);
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #34d399;
    }

    button:disabled {
      background-color: var(--border-color);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    .canvas-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    canvas {
      width: 100%;
      background-color: #000;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      image-rendering: pixelated;
    }

    #waveGridCanvas {
      aspect-ratio: 1 / 1;
    }

    #waveformCanvas {
      height: 120px;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }

    audio {
      width: 100%;
      height: 40px;
    }

    .legend {
      display: flex;
      gap: 15px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<div class="container">
  <div>
    <h1>Open-Space Geometric Sound Echo Simulator</h1>
    <p class="subtitle">Open boundary simulation (No room/wall reflections). Only the target geometric shape reflects acoustic sound waves.</p>
  </div>

  <div class="grid-layout">
    <!-- Controls Panel -->
    <div class="card controls">
      <div class="form-group">
        <label for="shapeSelect">Obstacle Geometry Shape</label>
        <select id="shapeSelect">
          <option value="circle">Circle</option>
          <option value="triangle">Triangle</option>
          <option value="star">Star</option>
          <option value="box">Square Box</option>
          <option value="concave">Concave Dish (Focusing Mirror)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="materialSelect">Object Absorption Material</label>
        <select id="materialSelect">
          <option value="rigid">Rigid Solid (Steel / Rock - High Echo)</option>
          <option value="medium">Medium Wood (Dampened Echo)</option>
          <option value="soft">Soft Foam (High Absorption / Weak Echo)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="freqSelect">Source Signal Type</label>
        <select id="freqSelect">
          <option value="pulse">Short Gaussian Acoustic Pulse</option>
          <option value="chirp">Frequency Modulated Chirp Sweep</option>
        </select>
      </div>

      <button id="startBtn">Run Wave Simulation</button>

      <div class="legend">
        <div class="legend-item"><div class="dot" style="background:#00ff00;"></div> Speaker</div>
        <div class="legend-item"><div class="dot" style="background:#ff0055;"></div> Receiver Mic</div>
        <div class="legend-item"><div class="dot" style="background:#3b82f6;"></div> Reflector Object</div>
      </div>
    </div>

    <!-- 2D Wave Grid Canvas -->
    <div class="card canvas-container">
      <label>Open-Space Acoustic Pressure Propagation (Absorbing Edges)</label>
      <canvas id="waveGridCanvas" width="160" height="160"></canvas>
    </div>
  </div>

  <!-- Recorded Audio Waveform & Output -->
  <div class="card">
    <label>Mic Signal (Direct Pulse + Only Target Shape Reflection)</label>
    <canvas id="waveformCanvas"></canvas>

    <div class="audio-controls">
      <audio id="audioPlayer" controls></audio>
      <button id="downloadBtn" disabled>Download Clean .WAV Echo</button>
    </div>
  </div>
</div>

<script>
/**
 * 2D Finite-Difference Time-Domain (FDTD) Simulation
 * Uses Absorbing Boundary Damping to eliminate outer wall reflections.
 */
const GRID_SIZE = 160;
const BOUNDARY_PADDING = 20; // Size of absorbing edge zone

let u = new Float32Array(GRID_SIZE * GRID_SIZE);     // Current time state
let uPrev = new Float32Array(GRID_SIZE * GRID_SIZE); // Previous time state
let uNext = new Float32Array(GRID_SIZE * GRID_SIZE); // Next time state
let dampingMap = new Float32Array(GRID_SIZE * GRID_SIZE); // Damping matrix for absorbing boundaries
let obstacles = new Uint8Array(GRID_SIZE * GRID_SIZE);  // Shape mask

// Position Setup
const SOURCE = { x: 30, y: 80 };
const MIC = { x: 30, y: 50 };
const SHAPE_CENTER = { x: 105, y: 80 };
const SHAPE_SIZE = 30;

let animationId = null;
let recordedMicSignal = [];
let audioBufferResult = null;

// UI Elements
const gridCanvas = document.getElementById('waveGridCanvas');
const waveCanvas = document.getElementById('waveformCanvas');
const gridCtx = gridCanvas.getContext('2d');
const waveCtx = waveCanvas.getContext('2d');

const shapeSelect = document.getElementById('shapeSelect');
const materialSelect = document.getElementById('materialSelect');
const freqSelect = document.getElementById('freqSelect');
const startBtn = document.getElementById('startBtn');
const downloadBtn = document.getElementById('downloadBtn');
const audioPlayer = document.getElementById('audioPlayer');

/**
 * Initialize Open Boundary Absorbing Mask (PML style)
 * Gradually absorbs sound energy near grid edges to prevent wall reflections.
 */
function initBoundaryDamping() {
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const idx = y * GRID_SIZE + x;
      let damp = 1.0;

      // Distance to nearest grid edge
      const distLeft = x;
      const distRight = GRID_SIZE - 1 - x;
      const distTop = y;
      const distBottom = GRID_SIZE - 1 - y;

      const minEdgeDist = Math.min(distLeft, distRight, distTop, distBottom);

      if (minEdgeDist < BOUNDARY_PADDING) {
        // Smoothly ramp damping down to zero at the outer edge
        const factor = minEdgeDist / BOUNDARY_PADDING;
        damp = Math.pow(factor, 0.5);
      }

      dampingMap[idx] = damp;
    }
  }
}

/**
 * Render Obstacle Shapes onto Grid Matrix
 */
function generateObstacles(shapeType) {
  obstacles.fill(0);

  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const idx = y * GRID_SIZE + x;
      const dx = x - SHAPE_CENTER.x;
      const dy = y - SHAPE_CENTER.y;

      let isInside = false;

      switch (shapeType) {
        case 'circle':
          isInside = (dx * dx + dy * dy) <= (SHAPE_SIZE * SHAPE_SIZE);
          break;

        case 'box':
          isInside = Math.abs(dx) <= SHAPE_SIZE && Math.abs(dy) <= SHAPE_SIZE;
          break;

        case 'triangle':
          const qx = dx + 10;
          const insideY = Math.abs(dy) <= (qx + SHAPE_SIZE) * 0.7;
          const insideX = qx >= -SHAPE_SIZE && qx <= SHAPE_SIZE;
          isInside = insideY && insideX;
          break;

        case 'star':
          const angle = Math.atan2(dy, dx);
          const dist = Math.sqrt(dx * dx + dy * dy);
          const r = SHAPE_SIZE * (0.6 + 0.4 * Math.cos(5 * angle));
          isInside = dist <= r;
          break;

        case 'concave':
          const distOuter = (dx * dx + dy * dy) <= (SHAPE_SIZE * SHAPE_SIZE + 200);
          const cutout = ((dx - 10) * (dx - 10) + dy * dy) <= (SHAPE_SIZE * SHAPE_SIZE);
          isInside = distOuter && !cutout && dx < 15;
          break;
      }

      if (isInside) {
        obstacles[idx] = 1;
      }
    }
  }
}

/**
 * 2D Wave Solver Simulation Step
 */
function runSimulation() {
  if (animationId) cancelAnimationFrame(animationId);

  u.fill(0);
  uPrev.fill(0);
  uNext.fill(0);
  recordedMicSignal = [];
  downloadBtn.disabled = true;

  generateObstacles(shapeSelect.value);

  const totalSteps = 600;
  let currentStep = 0;

  // Material reflectivity property for shape
  const matType = materialSelect.value;
  const objectReflectivity = matType === 'rigid' ? 1.0 : (matType === 'medium' ? 0.6 : 0.2);
  const c = 0.45; // Courant Stability Constant wave speed

  const imgData = gridCtx.createImageData(GRID_SIZE, GRID_SIZE);

  function step() {
    if (currentStep >= totalSteps) {
      finalizeAudioResult();
      return;
    }

    // 1. Emit Audio Signal Pulse
    const signalType = freqSelect.value;
    if (currentStep < 40) {
      const srcIdx = SOURCE.y * GRID_SIZE + SOURCE.x;
      if (signalType === 'pulse') {
        const t = currentStep - 20;
        u[srcIdx] += Math.exp(-0.02 * t * t) * 2.0;
      } else {
        u[srcIdx] += Math.sin(0.4 * currentStep) * 1.5;
      }
    }

    // 2. FDTD Propagation Calculation
    for (let y = 1; y < GRID_SIZE - 1; y++) {
      for (let x = 1; x < GRID_SIZE - 1; x++) {
        const idx = y * GRID_SIZE + x;

        // Shape Boundary: Reflects sound based on material factor
        if (obstacles[idx] === 1) {
          uNext[idx] = u[idx] * (1.0 - objectReflectivity);
          continue;
        }

        // 5-Point Discrete Laplacian
        const laplacian = u[idx - 1] + u[idx + 1] + u[idx - GRID_SIZE] + u[idx + GRID_SIZE] - 4 * u[idx];

        // Compute next step with Absorbing Outer Damping
        const nextVal = 2 * u[idx] - uPrev[idx] + c * c * laplacian;
        uNext[idx] = nextVal * dampingMap[idx];
      }
    }

    // Cycle state buffers
    uPrev.set(u);
    u.set(uNext);

    // 3. Record audio pressure value at Receiver Microphone position
    const micIdx = MIC.y * GRID_SIZE + MIC.x;
    recordedMicSignal.push(u[micIdx]);

    // 4. Render
    drawGrid(imgData);
    drawWaveform();

    currentStep++;
    animationId = requestAnimationFrame(step);
  }

  step();
}

/**
 * Render Wave Field to Pixel Canvas
 */
function drawGrid(imgData) {
  const data = imgData.data;

  for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
    const pIdx = i * 4;

    if (obstacles[i] === 1) {
      // Shape Object (Blue)
      data[pIdx] = 30;
      data[pIdx + 1] = 100;
      data[pIdx + 2] = 240;
      data[pIdx + 3] = 255;
    } else {
      const val = u[i];
      const pos = Math.min(255, Math.max(0, Math.floor(val * 180)));
      const neg = Math.min(255, Math.max(0, Math.floor(-val * 180)));

      data[pIdx] = neg;
      data[pIdx + 1] = pos;
      data[pIdx + 2] = pos > 0 ? 120 : neg;
      data[pIdx + 3] = 255;
    }
  }

  gridCtx.putImageData(imgData, 0, 0);

  // Overlay Source & Receiver
  gridCtx.fillStyle = '#00ff00';
  gridCtx.fillRect(SOURCE.x - 2, SOURCE.y - 2, 5, 5);

  gridCtx.fillStyle = '#ff0055';
  gridCtx.fillRect(MIC.x - 2, MIC.y - 2, 5, 5);
}

/**
 * Render Clean Waveform Graph
 */
function drawWaveform() {
  const w = waveCanvas.width = waveCanvas.clientWidth;
  const h = waveCanvas.height = waveCanvas.clientHeight;
  const midY = h / 2;

  waveCtx.fillStyle = '#020617';
  waveCtx.fillRect(0, 0, w, h);

  waveCtx.strokeStyle = '#334155';
  waveCtx.beginPath();
  waveCtx.moveTo(0, midY);
  waveCtx.lineTo(w, midY);
  waveCtx.stroke();

  if (recordedMicSignal.length === 0) return;

  waveCtx.strokeStyle = '#10b981';
  waveCtx.lineWidth = 2;
  waveCtx.beginPath();

  const dx = w / 600;
  for (let i = 0; i < recordedMicSignal.length; i++) {
    const x = i * dx;
    const y = midY - recordedMicSignal[i] * (h * 0.4);
    if (i === 0) waveCtx.moveTo(x, y);
    else waveCtx.lineTo(x, y);
  }
  waveCtx.stroke();
}

/**
 * Finalize Audio and Output Download File
 */
function finalizeAudioResult() {
  const sampleRate = 22050;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });

  const soundBuffer = audioCtx.createBuffer(1, recordedMicSignal.length * 20, sampleRate);
  const channelData = soundBuffer.getChannelData(0);

  for (let i = 0; i < channelData.length; i++) {
    const srcIdx = Math.floor(i / 20);
    channelData[i] = recordedMicSignal[srcIdx] || 0;
  }

  audioBufferResult = soundBuffer;

  const wavBlob = audioBufferToWavBlob(soundBuffer);
  const audioUrl = URL.createObjectURL(wavBlob);
  audioPlayer.src = audioUrl;
  downloadBtn.disabled = false;
}

/**
 * Convert Audio Buffer to Downloadable .WAV
 */
function audioBufferToWavBlob(buffer) {
  const numChannels = 1;
  const sampleRate = buffer.sampleRate;
  const bitDepth = 16;
  const samples = buffer.getChannelData(0);

  const bytesPerSample = bitDepth / 8;
  const blockAlign = numChannels * bytesPerSample;
  const wavBuffer = new ArrayBuffer(44 + samples.length * bytesPerSample);
  const view = new DataView(wavBuffer);

  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + samples.length * bytesPerSample, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true);
  writeString(view, 36, 'data');
  view.setUint32(40, samples.length * bytesPerSample, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }

  return new Blob([wavBuffer], { type: 'audio/wav' });
}

function writeString(view, offset, string) {
  for (let i = 0; i < string.length; i++) {
    view.setUint8(offset + i, string.charCodeAt(i));
  }
}

// Initialization & Event Listeners
initBoundaryDamping();
startBtn.addEventListener('click', runSimulation);

downloadBtn.addEventListener('click', () => {
  if (!audioBufferResult) return;
  const blob = audioBufferToWavBlob(audioBufferResult);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shape_echo_${shapeSelect.value}.wav`;
  a.click();
  URL.revokeObjectURL(url);
});

// Run initial scene simulation on load
runSimulation();
</script>
</body>
</html>
